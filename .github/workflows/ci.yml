name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Root tsconfig covers Edge Functions + tools; web build runs its own tsc.
      - run: pnpm exec tsc --noEmit

      - run: pnpm check:tokens

      - run: pnpm check:functions

      # The Edge Functions run on Deno, whose type-check differs from tsc's
      # (npm: specifiers, Deno globals, the generated import map). Without
      # this a Deno-only error first shows up when `supabase functions
      # deploy` bundles the function.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm check:deno

      - run: pnpm test

      - run: pnpm build
