name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Root tsconfig covers Edge Functions + tools; web build runs its own tsc.
      - run: pnpm exec tsc --noEmit

      - run: pnpm check:tokens

      - run: pnpm check:functions

      - run: pnpm test

      - run: pnpm build
